name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Um run por ref; cancela o anterior ao empurrar de novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Segredos dummy — NUNCA reais. Só pra o app buildar/testar em CI.
  DATABASE_URL: file:./ci.db
  AUTH_SECRET: ci-dummy-auth-secret
  NEXTAUTH_URL: http://localhost:3000
  API_KEY: ci-dummy-api-key
  API_KEY_USER_ID: ci-dummy-user-id
  ALLOWED_ORIGIN: http://localhost:3000

jobs:
  # ── Defesa em profundidade: repo público, nenhum segredo pode entrar em commit. ──
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  app:
    name: App (lint · unit · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Lê a versão do pnpm do campo packageManager do package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # postinstall do @prisma/client roda prisma generate (allowBuilds no pnpm-workspace.yaml)
      - run: pnpm install --frozen-lockfile
      - name: Lint (eslint)
        run: pnpm lint
      - name: Unit tests (Vitest)
        run: pnpm exec vitest run
      - name: Build (next build)
        run: pnpm build

  # ── E2E: servidor standalone real + SQLite real, sem mocks (pnpm test:e2e). ──
  e2e:
    name: E2E (servidor real)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # O globalSetup do e2e faz o próprio pnpm build e sobe o servidor
      - name: E2E tests (Vitest)
        run: pnpm test:e2e

  # ── Imagem de produção: construída AQUI, no runner, e publicada no GHCR. ──
  # Compilar no VPS levava ~25min e derrubava o próprio deploy: o load average
  # chegava a 22, o SSH caía no meio ("Shared connection closed") e o BuildKit
  # morria. Além da velocidade, isto garante que o artefato validado pelo CI é
  # exatamente o que vai para produção — antes o código era testado aqui e
  # recompilado lá.
  image:
    name: Imagem (build · push GHCR)
    needs: [app, e2e]
    # Só na main: PR não publica imagem.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # GHCR exige o nome do repositório em minúsculas.
      - name: Resolver o nome da imagem
        id: img
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          # Cache no próprio Actions: o build incremental fica no runner, longe
          # do host de produção.
          cache-from: type=gha
          cache-to: type=gha,mode=max
