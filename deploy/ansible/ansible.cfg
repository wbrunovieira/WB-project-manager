[defaults]
inventory = inventory/production.yml
remote_user = root
host_key_checking = False
gathering = smart
timeout = 30
result_format = yaml

[ssh_connection]
# Um build de imagem passa minutos sem escrever nada no canal, e um canal
# silencioso acaba derrubado no meio do caminho — foi assim que um deploy
# morreu com "Shared connection closed" enquanto o build seguia vivo no
# servidor. O keepalive mantém tráfego durante o silêncio.
# (O playbook também não depende mais de uma única conexão longa: o build roda
# destacado e é acompanhado por polling.)
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15 -o ServerAliveCountMax=120

[privilege_escalation]
become = True
become_method = sudo
become_user = root
