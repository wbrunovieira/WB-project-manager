---
# Deploy: puxa a imagem pronta do GHCR e recria o container.
#
# O servidor NÃO compila mais nada. Construir aqui levava ~25min e derrubava o
# próprio deploy — o load average chegava a 22, a sessão SSH caía no meio
# ("Shared connection closed") e o BuildKit morria. A imagem agora vem pronta
# do CI, que já a validou; aqui é só `pull` + `up`.
#
# Regra de ouro: um passo que falhou tem de FALHAR. Nada que importe passa por
# pipe — num pipe o código de saída é o do último comando (o `tail`, sempre 0),
# e um erro viraria tarefa verde.
- name: Quick Deploy WB Project Manager
  hosts: production
  gather_facts: false

  vars:
    # Referência completa da imagem, com a tag imutável do commit. O CD passa
    # via -e image_ref=...; o default serve para um deploy manual.
    image_ref: "ghcr.io/wbrunovieira/wb-project-manager:latest"
    # Credenciais efêmeras do job do CI. Sem elas o pull é anônimo, que só
    # funciona se o pacote no GHCR for público.
    ghcr_user: ""
    ghcr_token: ""
    pull_timeout: 600
    up_timeout: 300

  tasks:
    - name: Atualizar o código
      # Ainda necessário: o compose, o schema do Prisma e o .env do servidor
      # vivem no repositório. O build é que saiu daqui.
      raw: |
        set -e
        cd {{ app_dir }}
        git fetch origin
        git reset --hard origin/{{ git_branch }}
        echo "commit: $(git rev-parse --short HEAD) $(git log -1 --pretty=%s)"

    - name: Autenticar no GHCR
      # Token efêmero do job, entregue por stdin para não aparecer em `ps` nem
      # no log. Nenhuma credencial de longa duração fica no servidor — o
      # logout no fim encerra a sessão.
      when: ghcr_token | length > 0
      no_log: true
      raw: |
        set -e
        printf '%s' '{{ ghcr_token }}' | docker login ghcr.io -u '{{ ghcr_user }}' --password-stdin

    - name: Baixar a imagem
      raw: |
        cd {{ app_dir }}
        timeout {{ pull_timeout }} docker pull '{{ image_ref }}' > /tmp/wbpm-pull.log 2>&1
        CODE=$?
        tail -15 /tmp/wbpm-pull.log
        if [ "$CODE" = "124" ]; then
          echo "ERRO: pull passou de {{ pull_timeout }}s"
          exit 1
        fi
        if [ "$CODE" != "0" ]; then
          echo "ERRO: pull falhou (exit $CODE) — a imagem {{ image_ref }} existe e o token tem acesso?"
          exit "$CODE"
        fi

    - name: Recriar o container
      raw: |
        cd {{ app_dir }}
        APP_IMAGE='{{ image_ref }}' timeout {{ up_timeout }} docker compose -f {{ compose_file }} up -d --force-recreate > /tmp/wbpm-up.log 2>&1
        CODE=$?
        tail -20 /tmp/wbpm-up.log
        if [ "$CODE" != "0" ]; then
          echo "ERRO: subir o container falhou (exit $CODE)"
          exit "$CODE"
        fi

    - name: Encerrar a sessão no GHCR
      when: ghcr_token | length > 0
      raw: "docker logout ghcr.io > /dev/null 2>&1 || true"
      changed_when: false

    - name: Confirmar que o container roda a imagem esperada
      # Verde não é o mesmo que atualizado: enquanto o container velho estiver
      # de pé, é ELE que responde 200 no health check. Sem esta checagem, um
      # deploy que não trocasse nada passaria limpo.
      raw: |
        set -e
        cd {{ app_dir }}
        WANT=$(docker image inspect '{{ image_ref }}' | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['Id'])")
        GOT=$(docker inspect wb-project-manager | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['Image'])")
        STARTED=$(docker inspect wb-project-manager | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['State']['StartedAt'][:19])")
        AGE=$(( $(date -u +%s) - $(date -u -d "$STARTED" +%s) ))
        echo "imagem esperada: $WANT"
        echo "imagem rodando:  $GOT"
        echo "container iniciado há ${AGE}s"
        if [ "$WANT" != "$GOT" ]; then
          echo "ERRO: o container não está rodando a imagem do deploy"
          exit 1
        fi
        if [ "$AGE" -gt 600 ]; then
          echo "ERRO: o container não foi recriado (de pé há ${AGE}s)"
          exit 1
        fi

    - name: Health check
      # Poll em vez de `sleep` fixo: retorna assim que sobe e espera mais quando
      # a migração demora. E falha de verdade — antes só ecoava "WARNING" e
      # retornava 0, então app quebrada era deploy bem-sucedido.
      raw: |
        for i in $(seq 1 45); do
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:{{ app_port }}/api/health 2>/dev/null || true)
          if [ "$CODE" = "200" ]; then
            echo "health check OK depois de $((i * 2))s"
            exit 0
          fi
          sleep 2
        done
        echo "ERRO: health check terminou em '${CODE:-sem resposta}' após 90s"
        docker logs wb-project-manager --tail 40
        exit 1
      changed_when: false
