services:
  app:
    # Imagem pronta, construída e publicada pelo CI — o servidor não compila
    # mais nada. Compilar aqui levava ~25min e derrubava o próprio deploy
    # (load average 22, SSH caindo no meio, BuildKit morrendo).
    # O deploy passa a tag imutável do commit em APP_IMAGE; latest é só rede
    # de segurança para um `up` manual.
    image: ${APP_IMAGE:-ghcr.io/wbrunovieira/wb-project-manager:latest}
    container_name: wb-project-manager
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
      - API_KEY=${API_KEY}
      - API_KEY_USER_ID=${API_KEY_USER_ID}
      - AUTH_TRUST_HOST=true
      - TZ=America/Sao_Paulo
    volumes:
      - /opt/wb-project-manager/data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - wb-project-manager-network

networks:
  wb-project-manager-network:
    driver: bridge
